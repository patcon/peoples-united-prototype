<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peoples United - Deployment</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }

        p {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .link-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 1.5rem;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 200px;
        }

        .link-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        }

        .link-card h3 {
            margin: 0 0 0.5rem 0;
            color: #667eea;
        }

        .link-card p {
            margin: 0;
            font-size: 0.9rem;
            color: #666;
        }

        .badge {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🏗️ Peoples United</h1>
        <p>Welcome to the Peoples United prototype deployment. Choose where you'd like to go:</p>

        <div class="links">
            <a href="/" class="link-card">
                <h3>📱 Main App</h3>
                <p>View the main React application</p>
                <span class="badge">Production</span>
            </a>

            <a href="/storybook/" class="link-card">
                <h3>📚 Storybook</h3>
                <p>Browse component library and documentation</p>
                <span class="badge">Components</span>
            </a>
        </div>
    </div>
</body>

</html>
